[workspace]
resolver = "2"
members = ["tmite-proto", "tmite-core", "tmite"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.metadata.crane]
name = "tmite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
mnemonic = "1"
getrandom = "0.3"
zeroize = "1"
humantime = "2"
toml = "0.9"
dirs = "7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
iroh = "1"
tmite-proto = { path = "tmite-proto" }
tmite-core = { path = "tmite-core" }

[profile.release]
lto = "thin"
